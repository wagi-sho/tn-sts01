<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<title>出荷タイムスタディ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .bar{display:flex;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:#111}
.cam .bar .btn{flex:1;background:#222;color:#fff;border-color:#444}
.cam .msg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}

/* Layout: one-screen tool. Scan box on top, one big "next step" button, running log below. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#1b1f1d; --muted:#6a716d; --line:#d9ddd8;
  --accent:#1f6f4a; --accent-fg:#ffffff; --warn:#b4541c; --soft:#e7efe9; --pause:#c9a227; --pause-fg:#1b1f1d;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181a; --panel:#1d2325; --fg:#e8ebe8; --muted:#97a19b; --line:#2f3739;
  --accent:#4fb67f; --accent-fg:#0d1a12; --warn:#e58a4f; --soft:#1f3328; --pause:#e0b93a; --pause-fg:#1b1a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181a; --panel:#1d2325; --fg:#e8ebe8; --muted:#97a19b; --line:#2f3739;
  --accent:#4fb67f; --accent-fg:#0d1a12; --warn:#e58a4f; --soft:#1f3328; --pause:#e0b93a; --pause-fg:#1b1a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-width:560px;margin-inline:auto}
h1{font-size:1.05rem;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-weight:400;color:var(--muted);font-size:.8rem}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font:700 1.25rem var(--mono);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
.scan input:focus{outline:none;border-color:var(--accent)}
.btn{font:500 1rem var(--sans);padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.pause{background:var(--pause);color:var(--pause-fg);border-color:var(--pause);font-weight:700}
.works{display:flex;gap:8px;flex-wrap:wrap}
.works .btn{flex:1;min-width:110px;padding:10px 12px;font-size:.95rem}
.works-label{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.current{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.current.paused{border-color:var(--pause)}
.current .id{font:700 1.4rem var(--mono);letter-spacing:.02em;word-break:break-all}
.current .id.work{font-family:var(--sans)}
.current .state{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.85rem}
.current.paused .state span:first-child{color:var(--pause);font-weight:700}
.timer{font:700 2.6rem var(--mono);font-variant-numeric:tabular-nums;line-height:1;text-align:center;padding:6px 0}
.current.paused .timer{opacity:.5}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.done{color:var(--fg);font-weight:500}
.chip.now{background:var(--accent);color:var(--accent-fg);font-weight:700}
.big{font-size:1.3rem;padding:20px;border-radius:14px;width:100%}
.big:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:100px}
.hint{color:var(--muted);font-size:.8rem;line-height:1.5}
.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--mono)}
td.work{font-family:var(--sans);color:var(--accent);font-weight:500}
th{color:var(--muted);font-weight:500}
tfoot td{font-weight:700;border-bottom:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details{font-size:.85rem}
details summary{cursor:pointer;color:var(--muted)}
details label{display:block;margin-top:10px;color:var(--muted)}
details textarea{width:100%;margin-top:4px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head><body>
<h1>出荷タイムスタディ <small id="count">0件</small></h1>

<form class="scan" id="scanForm" autocomplete="off">
  <input id="scanInput" inputmode="text" placeholder="出荷IDをスキャン" aria-label="出荷ID" autofocus>
  <button class="btn" type="button" id="camBtn" aria-label="カメラで読む">📷</button>
  <button class="btn primary" type="submit">開始</button>
</form>
<div class="cam" id="cam" hidden><div class="msg" id="camMsg">バーコードを枠内に</div><video id="camVideo" playsinline autoplay muted></video><div class="bar"><button class="btn" id="camClose" type="button">閉じる</button></div></div>

<div id="worksWrap">
  <div class="works-label">IDなし作業</div>
  <div class="works" id="works"></div>
</div>

<section class="current" id="current" hidden>
  <div class="state"><span id="stateLabel">計測中</span><span id="startedAt"></span></div>
  <div class="id" id="curId"></div>
  <div class="timer" id="timer">00:00</div>
  <div class="steps" id="chips"></div>
  <button class="btn primary big" id="nextBtn" type="button"></button>
  <div class="row">
    <button class="btn pause" id="pauseBtn" type="button">一時停止</button>
    <button class="btn" id="undoBtn" type="button">1つ戻す</button>
    <button class="btn warn" id="cancelBtn" type="button">破棄</button>
  </div>
</section>

<p class="hint" id="idleHint">リーダー（Bluetooth HID）で読むと自動で「開始」され、ピックの計時が始まります。工程が終わるたびに大きなボタンを押してください。休憩や中断は「一時停止」。その間の時間は工程時間に含まれません。</p>

<section class="log">
  <header><span>記録</span>
    <span class="row"><button class="btn" id="copyBtn" type="button" style="padding:6px 12px;font-size:.8rem">CSVをコピー</button>
    <button class="btn warn" id="clearBtn" type="button" style="padding:6px 12px;font-size:.8rem">全消去</button></span></header>
  <div class="tbl"><table><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
</section>

<details><summary>設定（工程・IDなし作業）</summary>
  <label for="stepsBox">出荷IDごとの工程（1行1工程、最初の工程はスキャン時刻から）</label>
  <textarea id="stepsBox" rows="4"></textarea>
  <label for="worksBox">IDなし作業の種類（1行1つ）</label>
  <textarea id="worksBox" rows="4"></textarea>
  <button class="btn" id="saveSteps" type="button" style="margin-top:8px">保存</button>
</details>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_STEPS=["ピック","検品","梱包"];
const DEFAULT_WORKS=["トータルピック","荷主別トータルピック","準備作業","その他"];
let steps=load("steps")||DEFAULT_STEPS;
let works=load("works")||DEFAULT_WORKS;
let records=load("records")||[];
let cur=load("cur")||null; // {kind:"order"|"work", id, stamps:[...], paused:[ms per step], pauseAt:null|ms}
let armed=null;

function load(k){try{const v=localStorage.getItem("ts."+k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{if(v==null)localStorage.removeItem("ts."+k);else localStorage.setItem("ts."+k,JSON.stringify(v))}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600)}
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function clock(d){return new Date(d).toLocaleTimeString("ja-JP",{hour12:false})}
function iso(d){const x=new Date(d);const p=n=>String(n).padStart(2,"0");return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}:${p(x.getSeconds())}`}
function stepNames(){return cur.kind==="work"?[cur.id]:steps}
function stepIdx(){return cur.stamps.length-1}
function pausedNow(){return cur.pauseAt?Date.now()-cur.pauseAt:0}
function stepElapsed(){return Date.now()-cur.stamps[stepIdx()]-(cur.paused[stepIdx()]||0)-pausedNow()}


// --- sounds (Web Audio, short beeps) ---
let actx=null;
function beep(pattern){ // pattern: [[freq,ms],...]
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    let t=actx.currentTime;
    pattern.forEach(([f,ms])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+ms/1000+0.02);t+=ms/1000+0.04;
    });
  }catch(e){}
}
const SND={start:[[1200,80]],step:[[900,60],[1300,90]],done:[[800,70],[1000,70],[1400,160]],pause:[[500,180]],resume:[[700,60],[1000,60]],err:[[220,220]]};
const input=document.getElementById("scanInput");
function start(kind,id){
  if(cur){beep(SND.err);toast("計測中の作業があります。完了または破棄してください");return}
  cur={kind,id,stamps:[Date.now()],paused:[0],pauseAt:null};beep(SND.start);
  save("cur",cur);render();
}
document.getElementById("scanForm").addEventListener("submit",e=>{
  e.preventDefault();
  let id=input.value.trim().replace(/^B|B$/g,"");
  input.value="";
  if(!id)return;
  input.blur();start("order",id);
});
function renderWorks(){
  const w=document.getElementById("works");w.innerHTML="";
  works.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=n;b.addEventListener("click",()=>{input.blur();start("work",n)});w.appendChild(b)});
}

document.getElementById("nextBtn").addEventListener("click",()=>{
  if(!cur||cur.pauseAt)return;
  cur.stamps.push(Date.now());cur.paused.push(0);
  if(cur.stamps.length>stepNames().length)finish();else{beep(SND.step);save("cur",cur);render()}
});
document.getElementById("pauseBtn").addEventListener("click",()=>{
  if(!cur)return;
  if(cur.pauseAt){cur.paused[stepIdx()]=(cur.paused[stepIdx()]||0)+(Date.now()-cur.pauseAt);cur.pauseAt=null;beep(SND.resume);toast("再開")}
  else{cur.pauseAt=Date.now();beep(SND.pause)}
  save("cur",cur);render();
});
document.getElementById("undoBtn").addEventListener("click",()=>{
  if(!cur)return;
  if(cur.pauseAt){toast("再開してから戻してください");return}
  if(cur.stamps.length>1){cur.stamps.pop();cur.paused.pop();save("cur",cur);render()}else toast("これ以上戻せません");
});
document.getElementById("cancelBtn").addEventListener("click",()=>{cur=null;save("cur",null);render();refocus()});

function finish(){
  if(cur.pauseAt){cur.paused[stepIdx()]=(cur.paused[stepIdx()]||0)+(Date.now()-cur.pauseAt);cur.pauseAt=null}
  const names=stepNames();
  const r={kind:cur.kind,id:cur.id,start:cur.stamps[0],durs:[],pauseMs:0,steps:names.slice()};
  for(let i=1;i<cur.stamps.length;i++){const p=cur.paused[i-1]||0;r.durs.push(cur.stamps[i]-cur.stamps[i-1]-p);r.pauseMs+=p}
  r.total=r.durs.reduce((a,b)=>a+b,0);
  records.unshift(r);save("records",records);
  cur=null;save("cur",null);beep(SND.done);toast("記録しました");render();refocus();
}
function refocus(){setTimeout(()=>input.focus(),50)}

function render(){
  const c=document.getElementById("current");
  document.getElementById("idleHint").hidden=!!cur;
  document.getElementById("worksWrap").hidden=!!cur;
  c.hidden=!cur;
  if(cur){
    const names=stepNames(),k=stepIdx(),paused=!!cur.pauseAt;
    c.classList.toggle("paused",paused);
    document.getElementById("stateLabel").textContent=paused?"一時停止中":"計測中";
    const idEl=document.getElementById("curId");idEl.textContent=cur.id;idEl.classList.toggle("work",cur.kind==="work");
    document.getElementById("startedAt").textContent="開始 "+clock(cur.stamps[0]);
    const nb=document.getElementById("nextBtn");
    nb.textContent=(k===names.length-1?names[k]+" 完了 → 記録":names[k]+" 完了 → "+names[k+1]);
    nb.disabled=paused;
    document.getElementById("pauseBtn").textContent=paused?"▶ 再開":"一時停止";
    const chips=document.getElementById("chips");chips.innerHTML="";
    if(cur.kind==="order")names.forEach((s,i)=>{
      const el=document.createElement("span");el.className="chip"+(i<k?" done":i===k?" now":"");
      el.textContent=i<k?`${s} ${fmt(cur.stamps[i+1]-cur.stamps[i]-(cur.paused[i]||0))}`:s;chips.appendChild(el);
    });
    tick();
  }
  renderLog();
}
function tick(){if(cur)document.getElementById("timer").textContent=fmt(stepElapsed())}
setInterval(tick,250);

function renderLog(){
  const cols=steps;
  document.getElementById("thead").innerHTML="<tr><th>出荷ID / 作業</th><th>開始</th>"+cols.map(s=>`<th>${esc(s)}</th>`).join("")+"<th>合計</th><th>休止</th></tr>";
  const tb=document.getElementById("tbody");tb.innerHTML="";
  records.forEach(r=>{
    const tr=document.createElement("tr");
    const w=r.kind==="work";
    tr.innerHTML=`<td class="${w?"work":""}">${esc(r.id)}</td><td>${clock(r.start)}</td>`+cols.map((s,i)=>`<td>${!w&&r.durs[i]!=null?fmt(r.durs[i]):"–"}</td>`).join("")+`<td>${fmt(r.total)}</td><td>${r.pauseMs?fmt(r.pauseMs):"–"}</td>`;
    tb.appendChild(tr);
  });
  const tf=document.getElementById("tfoot");
  const orders=records.filter(r=>r.kind!=="work");
  if(orders.length){
    const avg=i=>{const v=orders.filter(r=>r.durs[i]!=null).map(r=>r.durs[i]);return v.length?fmt(v.reduce((a,b)=>a+b,0)/v.length):"–"};
    tf.innerHTML=`<tr><td>平均（出荷ID）</td><td></td>`+cols.map((s,i)=>`<td>${avg(i)}</td>`).join("")+`<td>${fmt(orders.reduce((a,r)=>a+r.total,0)/orders.length)}</td><td></td></tr>`;
  }else tf.innerHTML="";
  document.getElementById("count").textContent=records.length+"件";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

document.getElementById("copyBtn").addEventListener("click",()=>{
  const lines=[["種別","出荷ID/作業名","開始時刻",...steps.map(s=>s+"(秒)"),"合計(秒)","休止(秒)"].join(",")];
  records.slice().reverse().forEach(r=>{
    const w=r.kind==="work";
    lines.push([w?"作業":"出荷",r.id,iso(r.start),...steps.map((s,i)=>!w&&r.durs[i]!=null?Math.round(r.durs[i]/1000):""),Math.round(r.total/1000),Math.round(r.pauseMs/1000)].join(","));
  });
  const text=lines.join("\n");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("コピーしました")}catch(e){toast("コピーできません。長押しで選択してください")}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("CSVをコピーしました（"+records.length+"件）"),fallback)}else fallback();
});
document.getElementById("clearBtn").addEventListener("click",e=>{
  if(armed){records=[];save("records",records);armed=null;e.target.textContent="全消去";render();toast("消去しました");return}
  armed=true;e.target.textContent="もう一度押すと消去";setTimeout(()=>{armed=null;e.target.textContent="全消去"},3000);
});
document.getElementById("stepsBox").value=steps.join("\n");
document.getElementById("worksBox").value=works.join("\n");
document.getElementById("saveSteps").addEventListener("click",()=>{
  const v=document.getElementById("stepsBox").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const w=document.getElementById("worksBox").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(v.length<1){toast("工程を1つ以上入力してください");return}
  steps=v;works=w;save("steps",steps);save("works",works);renderWorks();render();toast("設定を保存しました");
});
renderWorks();render();
// --- camera scanning: own getUserMedia + BarcodeDetector (iOS 17+) or ZXing core fallback ---
let stream=null,scanning=false,zx=null;
const camEl=document.getElementById("cam"),video=document.getElementById("camVideo"),camMsg=document.getElementById("camMsg");
const canvas=document.createElement("canvas");
document.getElementById("camBtn").addEventListener("click",async()=>{
  if(cur){beep(SND.err);toast("計測中の作業があります");return}
  camEl.hidden=false;camMsg.textContent="カメラ起動中…";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg.textContent="この環境ではカメラを使えません（HTTPSで開いてください）";return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    camMsg.textContent=(e&&e.name==="NotAllowedError")?"カメラが許可されていません。Safariの「ぁあ」→Webサイトの設定→カメラを「許可」にしてください":"カメラを開けません："+(e&&e.name||e);
    return;
  }
  video.srcObject=stream;video.setAttribute("autoplay","");video.muted=true;
  try{await video.play()}catch(e){}
  camMsg.textContent="バーコードを枠内に";
  scanning=true;
  let detector=null;
  if(window.BarcodeDetector){try{detector=new BarcodeDetector({formats:["codabar","code_128","code_39","ean_13","itf","qr_code"]})}catch(e){detector=null}}
  if(!detector&&window.ZXing){
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    zx=new ZXing.MultiFormatReader();zx.setHints(hints);
  }
  if(!detector&&!zx){camMsg.textContent="読み取りライブラリを読み込めません（通信を確認）";return}
  const loop=async()=>{
    if(!scanning)return;
    if(video.readyState>=2&&video.videoWidth){
      let text=null;
      try{
        if(detector){const r=await detector.detect(video);if(r&&r.length)text=r[0].rawValue}
        else{
          const w=video.videoWidth,h=video.videoHeight;canvas.width=w;canvas.height=h;
          canvas.getContext("2d",{willReadFrequently:true}).drawImage(video,0,0,w,h);
          const src=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
          const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
          try{text=zx.decode(bmp).getText()}catch(e){}
          zx.reset();
        }
      }catch(e){}
      if(text){stopCam();input.value=text;document.getElementById("scanForm").requestSubmit();return}
    }
    setTimeout(loop,150);
  };
  loop();
});
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;camEl.hidden=true}
document.getElementById("camClose").addEventListener("click",stopCam);
</script>
</body></html>
